name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Go setup
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: build the app
        run: scripts/buildprod.sh